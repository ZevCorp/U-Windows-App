name: Windows release

# Disparado por Graph (Provider Studio → "Distribuir App"). Reproduce en CI
# los mismos pasos de windows-client/scripts/publish-release.ps1, y agrega
# la subida automática a Supabase (`vpk upload s3`) que ese script hoy deja
# manual. Ver RELEASING-WINDOWS.md para el flujo de referencia.

run-name: "Windows release ${{ inputs.version }} (${{ inputs.request_id }}) [${{ inputs.dry_run == true && 'dry-run' || 'real' }}]"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer a empaquetar, ej. 1.0.4 (lo calcula Graph)"
        required: true
        type: string
      request_id:
        description: "Id de correlación que usa Graph para encontrar este run"
        required: true
        type: string
      dry_run:
        description: "Solo probar el pipeline (sin publish/pack/upload reales)"
        required: false
        type: boolean
        default: false

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar vpk
        if: ${{ inputs.dry_run != true }}
        run: dotnet tool install -g vpk

      - name: Publicar U.exe
        if: ${{ inputs.dry_run != true }}
        env:
          # Key de Graph embebida en el build de distribución (X-API-Key). MSBuild la lee como
          # propiedad (GraphWorkflows.csproj → AssemblyMetadata GraphDefaultApiKey), de modo que el
          # Setup.exe distribuido llega CONECTADO sin que el usuario final ponga nada. Configura el
          # secreto en el repo: Settings → Secrets and variables → Actions → GRAPH_DEFAULT_API_KEY
          # (una key miracle_ generada en Provider Studio → API keys). Si el secreto no existe, el
          # build sigue funcionando pero sin key embebida (el usuario tendría que ponerla a mano).
          GraphDefaultApiKey: ${{ secrets.GRAPH_DEFAULT_API_KEY }}
        run: >
          dotnet publish windows-client\WindowsClient.csproj
          -c Release -r win-x64 --self-contained true -o out\assistant

      - name: Empaquetar con Velopack
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        run: |
          $packArgs = @('-u','U','-v','${{ inputs.version }}','-p','out\assistant','-e','U.exe','-o','out\releases')
          if (Test-Path 'windows-client\U.ico') {
            $packArgs += @('--icon','windows-client\U.ico')
          } else {
            Write-Host 'U.ico no está commiteado en el repo; se empaqueta sin icono personalizado.'
          }
          vpk pack @packArgs

      # SIN --region. `vpk upload s3` rechaza que se le den `--region` y
      # `--endpoint` a la vez ("please choose one") y sale con código 1. Es lo
      # que ha hecho fallar los SEIS intentos de publicación reales desde el
      # 2026-07-22: el build, el publish y el empaquetado terminaban bien y la
      # subida moría en la última línea, así que nunca llegó nada al bucket.
      # Supabase no es AWS: se identifica por endpoint, no por región.
      - name: Subir a Supabase (compatible con S3)
        if: ${{ inputs.dry_run != true }}
        env:
          VPK_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          VPK_S3_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          VPK_S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: >
          vpk upload s3 -o out\releases -c win --bucket windows
          --endpoint $env:VPK_S3_ENDPOINT
          --keyId $env:VPK_S3_KEY_ID --secret $env:VPK_S3_SECRET

      - name: Smoke test (dry run)
        if: ${{ inputs.dry_run == true }}
        run: Write-Host "Dry run OK — version ${{ inputs.version }}, request ${{ inputs.request_id }}"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run != true }}
        with:
          name: windows-release-${{ inputs.version }}
          path: out/releases/**
          if-no-files-found: error
