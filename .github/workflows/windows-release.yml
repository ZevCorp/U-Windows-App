name: Windows release

# Disparado por Graph (Provider Studio → "Distribuir App"). Reproduce en CI
# los mismos pasos de windows-client/scripts/publish-release.ps1, y agrega
# la subida automática a Supabase (`vpk upload s3`) que ese script hoy deja
# manual. Ver RELEASING-WINDOWS.md para el flujo de referencia.

run-name: "Windows release ${{ inputs.version }} (${{ inputs.request_id }}) [${{ inputs.dry_run == true && 'dry-run' || 'real' }}]"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer a empaquetar, ej. 1.0.4 (lo calcula Graph)"
        required: true
        type: string
      request_id:
        description: "Id de correlación que usa Graph para encontrar este run"
        required: true
        type: string
      dry_run:
        description: "Solo probar el pipeline (sin publish/pack/upload reales)"
        required: false
        type: boolean
        default: false

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar vpk
        if: ${{ inputs.dry_run != true }}
        run: dotnet tool install -g vpk

      - name: Publicar U.exe
        if: ${{ inputs.dry_run != true }}
        env:
          # Key de Graph embebida en el build de distribución (X-API-Key). MSBuild la lee como
          # propiedad (GraphWorkflows.csproj → AssemblyMetadata GraphDefaultApiKey), de modo que el
          # Setup.exe distribuido llega CONECTADO sin que el usuario final ponga nada. Configura el
          # secreto en el repo: Settings → Secrets and variables → Actions → GRAPH_DEFAULT_API_KEY
          # (una key miracle_ generada en Provider Studio → API keys). Si el secreto no existe, el
          # build sigue funcionando pero sin key embebida (el usuario tendría que ponerla a mano).
          GraphDefaultApiKey: ${{ secrets.GRAPH_DEFAULT_API_KEY }}
          # MISMO mecanismo para la voz en vivo (WindowsClient.csproj → AssemblyMetadata
          # GeminiDefaultApiKey). Secreto: GEMINI_DEFAULT_API_KEY (una key AIza... de AI Studio, con
          # saldo — si se agota, la voz en vivo falla en TODAS las instalaciones a la vez, porque es
          # la MISMA key en cada copia distribuida. Decisión consciente 2026-08-14: lo ideal es que
          # el backend la emita por sesión, como ya hace con Soniox; se embebe por velocidad).
          GeminiDefaultApiKey: ${{ secrets.GEMINI_DEFAULT_API_KEY }}
        run: >
          dotnet publish windows-client\WindowsClient.csproj
          -c Release -r win-x64 --self-contained true -o out\assistant

      - name: Empaquetar con Velopack
        if: ${{ inputs.dry_run != true }}
        shell: pwsh
        env:
          # FIRMA DE CÓDIGO (opcional hasta que haya certificado). Sin estos secretos el paquete sale
          # SIN FIRMAR y Windows avisa «no se pudo verificar el publicador» en cada instalación —
          # saltable con «Más información → Ejecutar de todas formas», pero es fricción real: el
          # 2026-08-15 bloqueó una instalación en mitad de una demo.
          #
          # Para activarlo, dos secretos en Settings → Secrets and variables → Actions:
          #   WINDOWS_CERT_PFX       el .pfx en base64  (certutil -encode cert.pfx cert.txt)
          #   WINDOWS_CERT_PASSWORD  su contraseña
          #
          # QUÉ CERTIFICADO COMPRAR, porque no todos resuelven lo mismo:
          #   · OV (~200-400 €/año): firma, pero SmartScreen SIGUE avisando hasta que el binario
          #     acumula reputación (semanas o cientos de descargas). No arregla una demo de mañana.
          #   · EV (~300-600 €/año, con token físico o HSM): confianza desde la primera descarga.
          #     Es el único que quita el aviso de verdad.
          #   · Autofirmado: NO sirve para máquinas ajenas — Windows no confía en él salvo que se
          #     instale como raíz en cada equipo, que no escala y toca la seguridad del destino.
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $packArgs = @('-u','U','-v','${{ inputs.version }}','-p','out\assistant','-e','U.exe','-o','out\releases')
          if (Test-Path 'windows-client\U.ico') {
            $packArgs += @('--icon','windows-client\U.ico')
          } else {
            Write-Host 'U.ico no está commiteado en el repo; se empaqueta sin icono personalizado.'
          }
          if ($env:CERT_PFX) {
            # El .pfx nunca se commitea: viaja como secreto en base64 y se materializa aquí, en el
            # runner efímero. Se borra al terminar el job con la máquina entera.
            $pfx = Join-Path $env:RUNNER_TEMP 'firma.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
            $packArgs += @('--signParams', "/fd sha256 /f `"$pfx`" /p `"$env:CERT_PASSWORD`" /tr http://timestamp.digicert.com /td sha256")
            Write-Host 'Firmando el paquete con el certificado del secreto.'
          } else {
            Write-Host 'SIN certificado (WINDOWS_CERT_PFX no está puesto): el paquete sale sin firmar y Windows avisará al instalar.'
          }
          vpk pack @packArgs

      # SE SUBE EN PARTES, Y POR ESO NO SE USA `vpk upload s3`.
      #
      # `vpk` sube cada archivo en UNA sola petición PUT. El paquete pesa ~80 MB
      # y el instalador ~85 MB, y la pasarela S3 de Supabase rechaza una petición
      # de ese tamaño con `RequestEntityTooLarge`. Eso es lo que hizo fallar los
      # SIETE intentos de publicación desde el 2026-07-22: el build, el publish y
      # el empaquetado terminaban bien y la subida moría en la última línea, así
      # que nunca llegó NADA al bucket y el botón de actualizar del cliente no
      # tenía de dónde traerse nada (2026-08-16).
      #
      # No era el cupo, aunque lo pareciera: el límite del bucket es 1 GB POR
      # ARCHIVO y todo el proyecto ocupaba 34 MB. Era el tamaño de la PETICIÓN,
      # no el del archivo — por eso cambiar `--endpoint`/`--region` nunca lo
      # arregló, que fue la corrección anterior.
      #
      # La CLI de aws parte los archivos grandes en trozos automáticamente
      # (multipart), que es justo lo que a la pasarela le falta, y viene ya
      # instalada en el runner de Windows. Aquí solo se copian archivos
      # estáticos: el feed es una carpeta, no una API.
      #
      # Se sobrescribe el feed con lo que acaba de empaquetarse, así que las
      # versiones viejas dejan de aparecer listadas. Es inocuo: el cliente solo
      # busca la ÚLTIMA, y los .nupkg antiguos siguen en el bucket.
      - name: Subir a Supabase (en partes)
        if: ${{ inputs.dry_run != true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
        run: |
          aws s3 cp out\releases s3://windows/ --recursive --endpoint-url $env:ENDPOINT
          Write-Host '--- lo que quedó publicado en el feed:'
          aws s3 ls s3://windows/ --endpoint-url $env:ENDPOINT

      - name: Smoke test (dry run)
        if: ${{ inputs.dry_run == true }}
        run: Write-Host "Dry run OK — version ${{ inputs.version }}, request ${{ inputs.request_id }}"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run != true }}
        with:
          name: windows-release-${{ inputs.version }}
          path: out/releases/**
          if-no-files-found: error
