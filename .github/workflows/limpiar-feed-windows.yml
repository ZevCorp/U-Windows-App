name: Limpiar feed de Windows

# UN SOLO USO, A MANO. Existe para retirar un feed que quedó anunciando una versión cuyo paquete no
# llegó a subirse: el cliente la ve, intenta bajarla, falla, y lo repite cada 30 minutos. Un feed que
# miente es peor que un bucket vacío (2026-08-16).
#
# Borra POR NOMBRE y nunca en bloque: `aws s3 rm --recursive` sobre un bucket es exactamente la clase
# de comando que un día se ejecuta contra el bucket equivocado.
#
# No se dispara solo. Si algún día el feed vuelve a vivir en Supabase, esto no debería seguir aquí.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe BORRAR para confirmar"
        required: true
        type: string

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la confirmación
        run: |
          if [ "${{ inputs.confirmar }}" != "BORRAR" ]; then
            echo "No se confirmó (hay que escribir BORRAR). No se toca nada."
            exit 1
          fi

      - name: Retirar el feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
        run: |
          for f in releases.win.json assets.win.json RELEASES; do
            echo "--- borrando $f"
            aws s3 rm "s3://windows/$f" --endpoint-url "$ENDPOINT" || true
          done
          echo "--- lo que queda en el bucket:"
          aws s3 ls s3://windows/ --endpoint-url "$ENDPOINT"
