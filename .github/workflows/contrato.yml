name: Contrato del grafo

# La mitad que SI puede correr en la nube. El contrato juzga las PROMESAS del nucleo
# (tests/ContratoDelGrafo/Contrato.cs) y no toca la pantalla, asi que un runner sin escritorio ni
# apps instaladas lo puede correr entero. Lo que no puede correr aqui son los escenarios
# (scripts/ci-local.ps1): esos abren apps de verdad y miden el resultado sobre el terreno, y por
# eso viven en la maquina del desarrollador.
#
# Corre en cada PR a main porque main roto bloquea a los tres. Una rama con promesas PENDIENTES da
# rojo aqui, y esta bien que asi sea: las fases intermedias son commits de la rama, no merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contrato-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # El script compila el nucleo en RELEASE y despues el contrato contra esos binarios recien
      # hechos, para que lo aprobado sea exactamente lo que se va a ejecutar. Su codigo de salida
      # es el numero de promesas incumplidas: 0 = CONTRATO INTACTO.
      - name: Juzgar el contrato
        id: contrato
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'contrato.txt'
          try {
            & ./scripts/contrato-del-grafo.ps1 *>&1 | Tee-Object -FilePath $log
            $codigo = $LASTEXITCODE
          } catch {
            # Nunca un catch mudo: si el arnes se cae, el motivo entero va al log y al resumen.
            "ARNES CAIDO: $_" | Tee-Object -FilePath $log -Append
            $codigo = 99
          }

          $total = @(Select-String -Path tests/ContratoDelGrafo/Contrato.cs -Pattern '^\s*Prueba\("').Count
          # CON LOS DOS PUNTOS: sin ellos tambien engancha la linea resumen "(N de ellas
          # PENDIENTES: ...)" y el recuento se pasa por uno, dejando el numero de incumplidas en
          # negativo. Un recuento que puede mentir es el aprendizaje n.10 (2026-08-13).
          $pend  = @(Select-String -Path $log -SimpleMatch 'PENDIENTE:').Count
          # Con el arnes caido el codigo no es un recuento de promesas: el verde se cuenta desde 0
          # en vez de dar un negativo que parezca un dato.
          $verdes = [Math]::Max(0, $total - $codigo)

          # El resumen del run dice el veredicto sin que nadie abra los logs, y distingue sus causas
          # (una promesa sin codigo todavia no es lo mismo que una regresion).
          $resumen = @(
            '## Contrato del grafo'
            ''
            "| Promesas | Verdes | Incumplidas | Pendientes (sin codigo aun) |"
            "|---|---|---|---|"
            "| $total | $verdes | $([Math]::Max(0, $codigo - $pend)) | $pend |"
            ''
            '```'
            (Get-Content $log -Raw)
            '```'
          )
          $resumen -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($codigo -ne 0) {
            Write-Host "::error::CONTRATO ROTO: $codigo promesa(s) incumplida(s) ($pend de ellas sin codigo todavia). Esto no puede entrar a main."
            exit 1
          }
          Write-Host "CONTRATO INTACTO: $total/$total promesas."

  # EL CONTRATO DE LA VOZ (spec 001): lo que promete la parte que convierte tramas del collar Omi en
  # muestras. Job aparte y no un paso mas, por dos razones:
  #
  #   1. Es independiente. voz/Omi es net8.0 puro: no necesita U.dll, ni WPF, ni que windows-client
  #      compile. Si el contrato del grafo se cae, este sigue dando su veredicto — y al reves.
  #   2. Se lee de un vistazo cual se rompio. Mezclar los dos en un job obliga a abrir el log para
  #      saber de cual estamos hablando, que es justo lo que separa a los contratos hermanos.
  #
  # Lo que NO cubre: el transporte BLE. No hay Bluetooth ni collar en un runner, y eso se verifica a
  # mano (nivel 4). Que este job este verde no dice que el collar funcione; dice que la logica que
  # convierte sus tramas en muestras cumple lo que promete.
  voz:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Juzgar el contrato de la voz
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'contrato-voz.txt'
          try {
            & ./scripts/contrato-de-la-voz.ps1 *>&1 | Tee-Object -FilePath $log
            $codigo = $LASTEXITCODE
          } catch {
            # Nunca un catch mudo: si el arnes se cae, el motivo entero va al log y al resumen.
            "ARNES CAIDO: $_" | Tee-Object -FilePath $log -Append
            $codigo = 99
          }

          $total = @(Select-String -Path voz/Contrato/Contrato.cs -Pattern '^\s*Prueba\("').Count
          # CON LOS DOS PUNTOS: sin ellos tambien engancha la linea resumen "(N de ellas
          # PENDIENTES: ...)" y el recuento se pasa por uno, dejando el numero de incumplidas en
          # negativo. Un recuento que puede mentir es el aprendizaje n.10 (2026-08-13).
          $pend  = @(Select-String -Path $log -SimpleMatch 'PENDIENTE:').Count
          $verdes = [Math]::Max(0, $total - $codigo)

          $resumen = @(
            '## Contrato de la voz'
            ''
            "| Promesas | Verdes | Incumplidas | Pendientes (sin codigo aun) |"
            "|---|---|---|---|"
            "| $total | $verdes | $([Math]::Max(0, $codigo - $pend)) | $pend |"
            ''
            '```'
            (Get-Content $log -Raw)
            '```'
          )
          $resumen -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($codigo -ne 0) {
            Write-Host "::error::VOZ ROTA: $codigo promesa(s) incumplida(s) ($pend de ellas sin codigo todavia). Esto no puede entrar a main."
            exit 1
          }
          Write-Host "VOZ INTEGRA: $total/$total promesas."

  # El contrato del MEDIDOR corre en Linux a proposito: su Dominio es net8.0 puro (sin WPF, sin
  # COM, sin pantalla), asi que un runner sin escritorio lo juzga entero y en segundos. La App del
  # medidor (WPF + la referencia COM a windows-graph) NO se compila aqui — es nivel 4, sobre el PC
  # real, como el resto de windows-client. Aqui se juzga lo juzgable sin pantalla, que es el punto
  # de haber partido Dominio y App.
  medidor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Juzgar el contrato del medidor
        id: medidor
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/medidor.txt"
          if dotnet run -c Release --project medidor/Contrato 2>&1 | tee "$log"; then
            codigo=0
          else
            codigo=$?
          fi

          total=$(grep -cE '^\s*Prueba\("' medidor/Contrato/Contrato.cs)
          # Los PENDIENTES de fases futuras (19-21 hoy son de fase 2) se cuentan aparte para no
          # confundir "aun sin codigo" con "incumplida" — aprendizaje n.10.
          pend=$(grep -c 'aún sin implementar' "$log" || true)
          verdes=$(( total - codigo )); [ $verdes -lt 0 ] && verdes=0

          {
            echo '## Contrato del medidor'
            echo ''
            echo "| Promesas | Verdes | Incumplidas |"
            echo "|---|---|---|"
            echo "| $total | $verdes | $codigo |"
            echo ''
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$codigo" -ne 0 ]; then
            echo "::error::MEDIDOR ROTO: $codigo promesa(s) incumplida(s). No puede entrar a main."
            exit 1
          fi
          echo "MEDIDOR INTEGRO: $total/$total promesas."
