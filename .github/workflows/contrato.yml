name: Contrato del grafo

# La mitad que SI puede correr en la nube. El contrato juzga las PROMESAS del nucleo
# (tests/ContratoDelGrafo/Contrato.cs) y no toca la pantalla, asi que un runner sin escritorio ni
# apps instaladas lo puede correr entero. Lo que no puede correr aqui son los escenarios
# (scripts/ci-local.ps1): esos abren apps de verdad y miden el resultado sobre el terreno, y por
# eso viven en la maquina del desarrollador.
#
# Corre en cada PR a main porque main roto bloquea a los tres. Una rama con promesas PENDIENTES da
# rojo aqui, y esta bien que asi sea: las fases intermedias son commits de la rama, no merges.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contrato-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # El script compila el nucleo en RELEASE y despues el contrato contra esos binarios recien
      # hechos, para que lo aprobado sea exactamente lo que se va a ejecutar. Su codigo de salida
      # es el numero de promesas incumplidas: 0 = CONTRATO INTACTO.
      - name: Juzgar el contrato
        id: contrato
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'contrato.txt'
          try {
            & ./scripts/contrato-del-grafo.ps1 *>&1 | Tee-Object -FilePath $log
            $codigo = $LASTEXITCODE
          } catch {
            # Nunca un catch mudo: si el arnes se cae, el motivo entero va al log y al resumen.
            "ARNES CAIDO: $_" | Tee-Object -FilePath $log -Append
            $codigo = 99
          }

          # EL RECUENTO LO DA EL CONTRATO, en su linea canonica. Antes se contaba `Prueba("` sobre
          # el .cs —que desde --autoprueba cuenta tambien las promesas de MENTIRA del arnes— y los
          # pendientes con `Select-String -SimpleMatch 'PENDIENTE'`, case-insensitive por defecto,
          # que se comia la linea de resumen y cualquier «pendiente» en minuscula (2026-08-12).
          $m = (Select-String -Path $log -Pattern '^CONTRATO:\s*(\d+)\s+promesas,\s*(\d+)\s+verdes,\s*(\d+)\s+incumplidas,\s*(\d+)\s+pendientes' |
                Select-Object -Last 1)
          if ($m) {
            $total  = [int]$m.Matches[0].Groups[1].Value
            $verdes = [int]$m.Matches[0].Groups[2].Value
            $rojas  = [int]$m.Matches[0].Groups[3].Value
            $pend   = [int]$m.Matches[0].Groups[4].Value
          } else {
            # Sin la linea no se sabe el desglose, y se dice: un arnes caido o un binario viejo no
            # pueden producir un recuento que parezca un dato. Antes esto daba «$total - $codigo»,
            # que con el arnes caido (codigo 99) publicaba un negativo recortado a 0.
            $total = -1; $verdes = -1; $rojas = -1; $pend = -1
          }
          $nd = { param($n) if ($n -lt 0) { '?' } else { "$n" } }

          # El resumen del run dice el veredicto sin que nadie abra los logs, y distingue sus causas
          # (una promesa sin codigo todavia no es lo mismo que una regresion).
          $resumen = @(
            '## Contrato del grafo'
            ''
            "| Promesas | Verdes | Incumplidas | Pendientes (sin codigo aun) |"
            "|---|---|---|---|"
            "| $(& $nd $total) | $(& $nd $verdes) | $(& $nd $rojas) | $(& $nd $pend) |"
            ''
            '```'
            (Get-Content $log -Raw)
            '```'
          )
          $resumen -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # El codigo de salida y la linea tienen que decir lo mismo. Si no, el arnes esta
          # descuadrado y su veredicto no vale — y eso se dice en vez de elegir uno de los dos.
          if ($rojas -ge 0 -and $codigo -ne $rojas) {
            Write-Host "::error::ARNES DESCUADRADO: codigo de salida $codigo pero la linea dice $rojas incumplidas. El veredicto no es fiable."
            exit 1
          }
          if ($codigo -ne 0) {
            Write-Host "::error::CONTRATO ROTO: $(& $nd $rojas) promesa(s) incumplida(s) ($(& $nd $pend) de ellas sin codigo todavia). Esto no puede entrar a main."
            exit 1
          }
          Write-Host "CONTRATO INTACTO: $total/$total promesas."
